name: actionlens-ci

on:
  push:
  pull_request:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install build ruff
      - run: ruff check src tests
      - run: python -m compileall -q src tests
      - run: python -m build
      - run: python -m pip install --force-reinstall --no-deps dist/actionlens-1.0.0-py3-none-any.whl
      - run: python -c "import actionlens; assert actionlens.__version__ == '1.0.0'"

  core:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q --ignore=tests/test_actionlens_v05.py
      - run: python -m pytest -q tests/test_actionlens_v05.py -k "not native_sdk and not postgres_repository_real"

  optional-integrations:
    strategy:
      fail-fast: false
      matrix:
        dependency-set:
          - "pydantic-ai>=1,<3"
          - "openai-agents>=0.8,<1"
          - "langchain-core>=0.3,<2"
          - "pydantic-ai openai-agents langchain-core opentelemetry-sdk httpx"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install optional integration
        env:
          DEPENDENCY_SET: ${{ matrix.dependency-set }}
        run: |
          read -ra dependencies <<< "$DEPENDENCY_SET"
          python -m pip install -e . pytest "${dependencies[@]}"
      - run: python -m pip freeze | grep -i 'pydantic\|openai\|langchain\|agents\|actionlens\|opentelemetry'
      - run: python -m pytest -q -v --tb=short --maxfail=1 -k "not postgres_repository_real and not core_import_does_not_load" tests/test_actionlens_core.py tests/test_actionlens_v03.py
      - run: python -m pytest -q -v --tb=long --maxfail=1 -k "not postgres_repository_real and not core_import_does_not_load" tests/test_actionlens_v05.py

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ACTIONLENS_POSTGRES_DSN: postgresql://postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[postgres]" pytest
      - run: sleep 3  # allow postgres health check to settle
      - run: python -m pytest -q
