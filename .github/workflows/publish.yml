name: actionlens-publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      twine_repository:
        description: "Target PyPI repository"
        required: true
        default: "pypi"
        type: choice
        options:
          - pypi
          - testpypi

permissions:
  contents: read
  id-token: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  build:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m pip install ".[test]"
      - run: python -m pytest -q
      - name: Verify release tag matches package version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          python -c "import os, tomllib; version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']; tag = os.environ['RELEASE_TAG']; assert tag in {version, 'v' + version}, f'release tag {tag!r} does not match package version {version!r}'"
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: actionlens-package
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.twine_repository == 'testpypi' && 'testpypi' || 'pypi' }}
      url: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.twine_repository == 'testpypi' && 'https://test.pypi.org/project/actionlens/' || 'https://pypi.org/project/actionlens/' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: actionlens-package
          path: dist/
      - name: Publish to PyPI
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.twine_repository == 'pypi')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://upload.pypi.org/legacy/
      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.twine_repository == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
