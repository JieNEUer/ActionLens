[project]
name = "actionlens"
version = "0.2.0"
description = "Low-intrusion tool governance and trajectory capture for Python agent systems."
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2",
]

[project.scripts]
actionlens = "actionlens.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["actionlens*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
