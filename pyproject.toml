[project]
name = "actionlens"
version = "0.3.0"
description = "Low-intrusion tool governance and trajectory capture for Python agent systems."
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2",
]

[project.optional-dependencies]
pydantic-ai = ["pydantic-ai>=1"]
openai-agents = ["openai-agents>=0.8"]
langchain = ["langchain-core>=0.3"]

[project.scripts]
actionlens = "actionlens.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["actionlens*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
